name: Build & Sign All Platforms

# 全平台构建：Windows / macOS / Linux
# 产物通过 GitHub Artifact Attestations（Sigstore）进行构建来源签名
# 推送 v* 标签时自动创建 GitHub Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: '构建并发布为 Release（需要先打标签）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write          # Sigstore 签名所需
      attestations: write      # 写入 Artifact Attestations
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build installers
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Generate build provenance (GitHub signature)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.exe
            release/*.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS (x64 + arm64)
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build installers
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: Generate build provenance (GitHub signature)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build installers
        run: npx electron-builder --linux AppImage deb rpm --x64 --publish never

      - name: Generate build provenance (GitHub signature)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundles
          # 合并所有产物到一个目录
          pattern: '*-installers'
          merge-multiple: true

      - name: List bundled files
        run: ls -la release-bundles

      - name: Create release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bundles/*.exe
            release-bundles/*.dmg
            release-bundles/*.zip
            release-bundles/*.AppImage
            release-bundles/*.deb
            release-bundles/*.rpm
            release-bundles/*.yml
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          body: |
            ## DailyKit 百宝工具箱

            全平台安装包（Windows / macOS / Linux）。

            ### 安装包签名验证
            所有安装包均已通过 **GitHub Artifact Attestations**（Sigstore）生成构建来源签名证明，
            可在仓库 **Actions** 构建记录或本地用以下命令验证：

            ```bash
            gh attestation verify <安装包路径> --repo DaiYiqq/DailyKit
            ```

            验证通过即表示安装包确实由本仓库的官方 CI 构建、未被篡改。

            ### 下载指引
            - **Windows**：下载 `.exe`（64 位 x64），双击按向导安装
            - **macOS**：Apple 芯片（M 系列）选 `arm64`，Intel 芯片选 `x64`；下载 `.dmg` 拖入「应用程序」
            - **Linux**：`.AppImage`（下载后 `chmod +x` 直接运行）、`.deb`（Debian/Ubuntu）或 `.rpm`（Fedora/CentOS）
